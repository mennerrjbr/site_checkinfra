# Manual cleanup of files left on the FTP root by the previous site.
# The login directory is public_html. This job builds dist/ from main,
# prints every server path it will delete or keep, then deletes only
# files that are absent from dist and not on the protected list.
# Protected: cgi-bin/, .well-known/, wa/ (WhatsApp relay, including
# config.php and server-only runtime files such as .seen.json and
# .errors.json), .ftpquota, .htaccess, .htaccess.phpupgrader*,
# .ftp-deploy-sync-state-v2.json, and dist/.
name: Cleanup old FTP files

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-old-files.yml
      - .github/scripts/cleanup-old-ftp.py

permissions:
  contents: read

jobs:
  cleanup:
    name: List and delete old FTP files
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Self-test cleanup rules
        run: python3 .github/scripts/cleanup-old-ftp.py --self-test

      - name: Delete server files that are not in dist
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 .github/scripts/cleanup-old-ftp.py
