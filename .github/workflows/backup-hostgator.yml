name: Backup HostGator

# Read-only backup of the live site. This workflow must never upload,
# delete, rename, or modify anything on the FTP server.
on:
  push:
    branches:
      - backup-hostgator-2026-11-17
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Install lftp
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y lftp zip
          lftp --version

      - name: Download website read-only
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${FTP_SERVER}" ] || [ -z "${FTP_USERNAME}" ] || [ -z "${FTP_PASSWORD}" ]; then
            echo "FTP credentials are not available to this workflow."
            exit 1
          fi

          mkdir -p ./backup/public_html

          # Settings are loaded before connect. The mirror is download-only:
          # do not add --reverse/-R, put, rm, or mv.
          write_rc() {
            cat > "${HOME}/.lftprc" <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-allow $1
          set ssl:verify-certificate no
          set ftp:ssl-protect-data $2
          set ftp:ssl-protect-list $2
          set ftp:passive-mode true
          set ftp:prefer-epsv false
          set dns:order "inet"
          set net:timeout 120
          set net:max-retries 2
          set net:reconnect-interval-base 5
          EOF
          }

          mode=tls
          write_rc yes yes

          run_lftp() {
            local script="$1"
            local status
            set +e
            lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" -e "$script" > /tmp/lftp.out 2>&1
            status=$?
            set -e
            cat /tmp/lftp.out
            if [ "$status" -ne 0 ] && [ "$mode" = "tls" ] && grep -qiE 'certificate verification|gnutls|handshake|Login failed|Connection refused|timed out|Could not connect|Name or service not known' /tmp/lftp.out; then
              echo "TLS FTP failed; falling back to plain FTP without SSL (download-only)."
              mode=plain
              write_rc no no
              set +e
              lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" -e "$script" > /tmp/lftp.out 2>&1
              status=$?
              set -e
              cat /tmp/lftp.out
            fi
            return "$status"
          }

          echo "Read-only top-level listing of FTP root:"
          run_lftp "cls -la /; bye" || true

          echo "Starting download-only mirror of / into ./backup/public_html/."
          if ! run_lftp "mirror --verbose --parallel=4 / ./backup/public_html/; bye"; then
            echo "Download-only mirror failed."
            exit 1
          fi

          file_count="$(find ./backup/public_html -type f | wc -l | tr -d '[:space:]')"
          size_bytes="$(du -sb ./backup/public_html | awk '{print $1}')"
          echo "Downloaded file count: ${file_count}"
          echo "Downloaded size bytes: ${size_bytes}"
          echo "Top-level entries:"
          find ./backup/public_html -mindepth 1 -maxdepth 1 -printf '%f\n' | sort
          if [ "${file_count}" -eq 0 ]; then
            echo "No files were downloaded."
            exit 1
          fi

      - name: Save recursive listing
        run: ls -laR backup > backup/listing.txt

      - name: Create zip archive
        run: zip -r backup_17_11_26.zip backup

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: backup_17_11_26
          path: backup_17_11_26.zip
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: true
