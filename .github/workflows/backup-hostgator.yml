name: Backup HostGator

# Read-only backup of the live site. This workflow must never upload,
# delete, rename, or modify anything on the FTP server.
on:
  push:
    branches:
      - backup-hostgator-2026-11-17
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Install lftp
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y lftp zip
          lftp --version

      - name: Download website read-only
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${FTP_SERVER}" ] || [ -z "${FTP_USERNAME}" ] || [ -z "${FTP_PASSWORD}" ]; then
            echo "FTP credentials are not available to this workflow."
            exit 1
          fi

          mkdir -p ./backup/checkinfra.com.br

          # Settings are loaded before connect. The mirror is download-only:
          # do not add --reverse/-R, put, rm, or mv.
          write_rc() {
            cat > "${HOME}/.lftprc" <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-allow $1
          set ssl:verify-certificate no
          set ftp:ssl-protect-data $2
          set ftp:ssl-protect-list $2
          set ftp:passive-mode true
          set ftp:prefer-epsv false
          set dns:order "inet"
          set net:timeout 60
          set net:max-retries 2
          set net:reconnect-interval-base 5
          EOF
          }

          mode=tls
          write_rc yes yes

          run_lftp() {
            local script="$1"
            local status
            set +e
            lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" -e "$script" > /tmp/lftp.out 2>&1
            status=$?
            set -e
            cat /tmp/lftp.out
            if [ "$status" -ne 0 ] && [ "$mode" = "tls" ] && grep -qiE 'certificate verification|gnutls|handshake|Login failed|Connection refused|timed out|Could not connect|Name or service not known' /tmp/lftp.out; then
              echo "TLS FTP failed; falling back to plain FTP without SSL (download-only)."
              mode=plain
              write_rc no no
              set +e
              lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" -e "$script" > /tmp/lftp.out 2>&1
              status=$?
              set -e
              cat /tmp/lftp.out
            fi
            return "$status"
          }

          echo "Read-only listing of the FTP login directory:"
          run_lftp "cls -la; bye" || true
          echo "Read-only names in the parent directory:"
          run_lftp "cls -1 .. > /tmp/parent-names.txt; bye" || true
          if [ -f /tmp/parent-names.txt ]; then
            sed -i 's/\r$//' /tmp/parent-names.txt
            parent_count="$(grep -c . /tmp/parent-names.txt || true)"
            echo "Parent entry count: ${parent_count}"
            if [ "${parent_count}" -le 40 ]; then
              sed 's/^/  /' /tmp/parent-names.txt
            else
              echo "Parent has many entries; showing likely site names only."
              grep -E 'checkinfra|public_html|^www$|htdocs|httpdocs' /tmp/parent-names.txt || true
            fi
          fi

          # /checkinfra.com.br is the documented site folder. Older deploys
          # used public_html. Try those, then the login directory itself.
          try_mirror() {
            local remote="$1"
            local extra="${2:-}"
            local status
            local count
            echo "Attempting download-only mirror of ${remote}"
            if [ -n "$extra" ]; then
              run_lftp "mirror --verbose --parallel=4 ${extra} ${remote} ./backup/checkinfra.com.br/; bye" && status=0 || status=$?
            else
              run_lftp "mirror --verbose --parallel=4 ${remote} ./backup/checkinfra.com.br/; bye" && status=0 || status=$?
            fi
            count="$(find ./backup/checkinfra.com.br -type f | wc -l | tr -d '[:space:]')"
            echo "Local file count after ${remote}: ${count}"
            if [ "$count" -gt 0 ] && [ "$status" -ne 0 ]; then
              echo "Mirror of ${remote} downloaded files but failed."
              exit 1
            fi
            if [ "$count" -gt 0 ]; then
              echo "Selected remote path: ${remote}"
              return 0
            fi
            return 1
          }

          if try_mirror "/checkinfra.com.br/"; then
            selected="/checkinfra.com.br/"
          elif try_mirror "checkinfra.com.br/"; then
            selected="checkinfra.com.br/"
          elif try_mirror "public_html/"; then
            selected="public_html/"
          elif try_mirror "/public_html/"; then
            selected="/public_html/"
          elif try_mirror "www/"; then
            selected="www/"
          elif try_mirror "../checkinfra.com.br/"; then
            selected="../checkinfra.com.br/"
          elif try_mirror "../public_html/"; then
            selected="../public_html/"
          elif try_mirror "../www/"; then
            selected="../www/"
          elif try_mirror "./" "--exclude ^mail/ --exclude ^logs/ --exclude ^tmp/ --exclude ^\\.cpanel/ --exclude ^public_ftp/ --exclude ^\\.trash/ --exclude ^\\.spamassassin/"; then
            selected="./"
          else
            echo "No files were downloaded."
            exit 1
          fi

          file_count="$(find ./backup/checkinfra.com.br -type f | wc -l | tr -d '[:space:]')"
          size_bytes="$(du -sb ./backup/checkinfra.com.br | awk '{print $1}')"
          echo "Downloaded from remote path: ${selected}"
          echo "Downloaded file count: ${file_count}"
          echo "Downloaded size bytes: ${size_bytes}"
          echo "Top-level entries:"
          find ./backup/checkinfra.com.br -mindepth 1 -maxdepth 1 -printf '%f\n' | sort
          if [ "${file_count}" -eq 0 ]; then
            echo "No files were downloaded."
            exit 1
          fi

      - name: Save recursive listing
        run: ls -laR backup > backup/listing.txt

      - name: Create zip archive
        run: zip -r backup_17_11_26.zip backup

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: backup_17_11_26
          path: backup_17_11_26.zip
          retention-days: 7
          if-no-files-found: error
