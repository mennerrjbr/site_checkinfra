# Deploy only after this file is on main (push) or via workflow_dispatch.
# Do not enable dangerous-clean-slate: a new state file means files from the
# previous deploy stay on the server until someone removes them by hand.
name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build and FTP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Self-test WhatsApp config generator
        run: php .github/scripts/write-wa-config.php --self-test

      # Secrets may be unset. The generator writes empty strings and the relay
      # fails closed. Do not print the env vars or the generated file.
      - name: Generate WhatsApp relay config
        env:
          WA_META_APP_SECRET: ${{ secrets.WA_META_APP_SECRET }}
          WA_ROUTINE_WEBHOOK_URL: ${{ secrets.WA_ROUTINE_WEBHOOK_URL }}
          WA_ROUTINE_AUTH_HEADER: ${{ secrets.WA_ROUTINE_AUTH_HEADER }}
        run: php .github/scripts/write-wa-config.php dist/wa/config.php

      - name: FTP deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./
          state-name: .ftp-deploy-sync-state-v2.json
          # Keep dangerous-clean-slate off. It deletes the whole server dir,
          # including excluded files. These excludes cover the relay's runtime
          # files (created on the server, never in dist/) so an incremental
          # sync will not remove them even if a past state file recorded them.
          # config.php is generated above and must stay deployable.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            cgi-bin/**
            **/cgi-bin/**
            .well-known/**
            **/.well-known/**
            .ftpquota
            **/.ftpquota
            **/.seen.json
            **/.errors.json
